
# CI (PLAN §11.5). Every job runs the same `make` targets a developer runs locally.
# The Playwright end-to-end test runs in the `stack` job (camera-less in 1b; the fake camera comes in Milestone 2).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, type check, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # the video upload tests run the real ffmpeg and ffprobe on the host; the pipeline tests run the
      # real MediaPipe, which needs the same libraries as the backend image (backend/Dockerfile)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 libegl1 libgles2
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci
      # The Pipeline B tests run the real gaze network: the small weights download into pytest's cache
      # on first use, the large ResNet-50 ones are fetched here (sha256 checked); both are cached.
      - uses: actions/cache@v4
        with:
          path: |
            backend/.pytest_cache/d/models
            models-ci
          key: models-${{ hashFiles('shared/models.json') }}
      - run: python3 shared/download_model.py fetch models-ci l2cs_resnet50
      # ruff, mypy --strict, eslint, tsc --strict
      - run: make lint
      # shellcheck on every script and the proxy entrypoint
      - run: make lint-shell
      # pytest (database tests start a real postgres:16 container) and vitest
      - run: make test
        env:
          L2CS_RESNET50: ${{ github.workspace }}/models-ci/resnet50_gaze.onnx

  images:
    name: build and check the backend and proxy images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: make test-images

  stack:
    name: production stack, setup script, backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # compose stack with TLS_MODE=internal: healthchecks, ports, admin login over HTTPS
      - run: make test-stack
      # scripts/setup.sh: prompts, secrets, DNS check, full run, idempotent re-run
      - run: make test-setup
      # backup, destroy everything, restore, compare every row and file
      - run: make test-backup
      # real Chromium (Playwright): a full dummy session, a dropped connection, a reload and resume
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make e2e

  install-docker:
    name: Docker install script
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make test-install-docker

  dev-stack:
    name: development stack and model download
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Node 22+: the HMR check in test-dev-stack.sh uses the global WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test-dev
      - run: make test-fetch-models

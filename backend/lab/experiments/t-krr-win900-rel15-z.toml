name = "t-krr-win900-rel15-z"
description = "Best of items 1-7 (kernel ridge, 900 ms window, blink score 0.15 above the session median) plus the iris depth (E8)"
pipelines = ["a"]
tune_studies = [7]
holdout_studies = [6, 8]
fit_validation = "all"
model = "krr"
blink_relative_delta = 0.15
features = ["iris_l_x", "iris_l_y", "iris_r_x", "iris_r_y", "open_l", "open_r", "yaw", "pitch", "roll", "face_ratio", "iris_l_z", "iris_r_z"]

[config]
calib_window_before_click_ms = 900

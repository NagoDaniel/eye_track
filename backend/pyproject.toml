[project]
name = "eyetrack-backend"
version = "0.1.0"
description = "Webcam eye-tracking backend: API and processing worker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "av>=18.1.0",
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "mediapipe>=1.1.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.1.4",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Form"]

[tool.mypy]
strict = true
files = ["app", "worker", "tests", "alembic", "cli.py", "../shared"]

[tool.pytest.ini_options]
testpaths = ["tests", "../shared/tests"]
pythonpath = ["."]

[project]
name = "eyetrack-backend"
version = "0.1.0"
description = "Webcam eye-tracking backend: API and processing worker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["app", "worker", "tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

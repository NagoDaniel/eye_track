[project]
name = "eyetrack-backend"
version = "0.1.0"
description = "Webcam eye-tracking backend: API and processing worker"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["app", "worker", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

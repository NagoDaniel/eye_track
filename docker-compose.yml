# Production stack (PLAN §11.1, §11.2). Configuration comes from `.env` (see `.env.example`).
name: eyetrack

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: eyetrack-backend:local
  restart: unless-stopped
  logging: *logging
  environment: &backend-env
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATA_ROOT: /data
    MODELS_ROOT: /models
    API_WORKERS: ${API_WORKERS:-2}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    ONNX_PROVIDER: ${ONNX_PROVIDER:-cpu}
    MAX_UPLOAD_CHUNK_MB: ${MAX_UPLOAD_CHUNK_MB:-10}
    MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: eyetrack
      POSTGRES_DB: eyetrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyetrack -d eyetrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: prepares the data directories (bind mounts are created root-owned by Docker),
  # then drops to the app user and runs the migrations. `restart: "no"` because it exits.
  migrate:
    <<: *backend
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/videos /data/studies /data/analysis &&
        chown 10001:10001 /data /data/videos /data/studies /data/analysis &&
        exec setpriv --reuid=10001 --regid=10001 --clear-groups alembic upgrade head
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      # urlopen raises on HTTP 503, so this fails when the database is unreachable.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "worker.run"]
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${MODELS_DIR:-./models}:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      # Exits non-zero when the heartbeat row (updated every 30 s) is older than 90 s.
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: eyetrack-proxy:local
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      TLS_MODE: ${TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Mounted from the host paths in .env when TLS_MODE=files (see the volumes below).
      TLS_CERT_FILE: /run/tls/cert.pem
      TLS_KEY_FILE: /run/tls/key.pem
      MAX_UPLOAD_CHUNK_MB: ${MAX_UPLOAD_CHUNK_MB:-10}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
      MAX_ADMIN_REQUEST_MB: ${MAX_ADMIN_REQUEST_MB:-1}
      # Keep Caddy's state out of /data, where the videos are mounted.
      XDG_DATA_HOME: /caddy/data
      XDG_CONFIG_HOME: /caddy/config
    volumes:
      - caddy_data:/caddy/data
      - caddy_config:/caddy/config
      - ${DATA_DIR:-./data}/videos:/data/videos:ro
      # Unset TLS_CERT_FILE/TLS_KEY_FILE mount /dev/null; the entrypoint rejects that in `files` mode.
      - ${TLS_CERT_FILE:-/dev/null}:/run/tls/cert.pem:ro
      - ${TLS_KEY_FILE:-/dev/null}:/run/tls/key.pem:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
